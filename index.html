<style>
/* Theme and shared surfaces */
:root {
  color-scheme: dark;

  --surface:#202e32; --raised:#25363b; --field:#152125; --line:#809fa244;

}
html[data-th=light] {
  color-scheme:light;
  --base:#edf4f2; --text:#182824; --muted:#4a615c; --accent:#176653; --ink:#fff;
  --surface:#f8fcfb; --raised:#f4faf8; --field:#fff; --line:#496b6044;
  --shine:#fff; --wash:#c4e6dc; --ambient:#d5e1f0; --shadow:#263e3320;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; isolation:isolate;
  padding-top:env(safe-area-inset-top);
  color:var(--text); background:var(--base);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
.bg {
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse at 18% 0%,var(--wash),transparent 62%),
             radial-gradient(ellipse at 100% 78%,var(--ambient),transparent 58%),var(--base);
}
main {
  max-width:768px; margin:auto;
  padding:clamp(22px,5vw,56px) max(14px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.glass {
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:inset 0 1px var(--shine),0 12px 30px var(--shadow);
}
@supports (background:color-mix(in srgb,white,transparent)) {
  .glass {
    background:linear-gradient(150deg,var(--shine),transparent 55%),color-mix(in srgb,var(--surface) 85%,transparent);
    -webkit-backdrop-filter:blur(18px) saturate(135%);
    backdrop-filter:blur(18px) saturate(135%);

}
.card { padding:clamp(14px,4vw,24px); margin:0 0 var(--gap); overflow-wrap:anywhere; }

.row { display:flex; gap:var(--gap); align-items:center; }

h1 { font-size:clamp(1.85rem,6vw,3rem); line-height:1.06; letter-spacing:-.045em; font-weight:750; }
h2 { font-size:1.15rem; line-height:1.24; letter-spacing:-.02em; }
.big { font-size:1.18rem; font-weight:700; letter-spacing:-.018em; font-variant-numeric:tabular-nums; }

.login { max-width:450px; padding-top:clamp(44px,15vh,160px); }
.login .card { padding:clamp(18px,6vw,32px); }

/* Controls and navigation */
button,input,select { font:inherit; color:inherit; min-height:var(--touch); }
button,summary,[data-a] { touch-action:manipulation; }
button,[data-a],summary { cursor:pointer; }
button {
  padding:8px 13px; background:var(--raised); border:1px solid var(--line);
  border-radius:var(--control); line-height:1.2; font-size:.9rem; font-weight:620;
  transition:background-color .18s, border-color .18s, box-shadow .18s;

button.p { background:var(--accent); color:var(--ink); border-color:transparent; }
button:active { box-shadow:inset 0 0 0 2px currentColor; }
input,select {
  display:block; width:100%; min-width:0; padding:8px 11px;

.ic { display:inline-grid; place-items:center; flex:none; width:var(--touch); padding:0; }
.icon { display:block; width:21px; height:21px; flex:none; }
nav {

.set.t { grid-template-columns:1.5rem minmax(0,1fr) calc(2 * var(--touch) + 4px); }
.set input { padding-inline:6px; font-variant-numeric:tabular-nums; }
.tm { font-size:clamp(1.65rem,7.5vw,2.75rem); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
#tm { text-align:center; margin-bottom:8px; }
.hd { color:var(--muted); font-size:.75rem; margin-top:12px; }
.ch { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.dn { border-inline-start:3px solid var(--accent); }
.letter {

.exercise-card .tag { flex:none; max-width:45%; }
.mn { position:relative; z-index:3; flex:none; }
.mn summary {

.menu,.sheet { background:var(--raised); }
.menu { position:absolute; inset:calc(100% + 6px) 0 auto auto; padding:6px; min-width:180px; }
.menu button { display:block; width:100%; text-align:left; border-color:transparent; background:none; }
.sheet {

.sheet-backdrop { position:fixed; inset:0; z-index:20; background:#080e1480; }
.sheet .row { gap:6px; }
.chart { display:block; width:100%; margin:8px 0; --chart:var(--accent); }
.chat-user { margin-inline-start:clamp(14px,9vw,64px); border-inline-start:3px solid var(--accent); }
.chat-coach { margin-inline-end:clamp(10px,5vw,40px); }
@media (max-width:370px) {
  .row { gap:7px; }
  .card { padding-inline:12px; }
  .filters { gap:6px; }
  button { padding-inline:9px; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { transition:none !important; animation:none !important; }

.session-clock { display:flex;justify-content:space-between;align-items:center;padding:8px 4px;margin-bottom:12px; }
.session-clock strong { font-size:1.45rem;font-variant-numeric:tabular-nums; }
.session-actions { position:sticky;bottom:0;z-index:4;padding:10px;margin-top:12px; }
.session-actions button { flex:1; }
.session-view { padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
.guided-inputs label { flex:1; }
.guided-inputs input { margin-top:4px; }
.guided-card h2 { font-size:1.5rem;margin:4px 0 12px; }

function todoWeek(ts){

async function connectTodo(){
  if(!S.u||todoBusy)return;
  const trackerUid=S.u.uid;
  todoBusy=true;todoMessage='';R();
  try{
    const {user}=await signInWithPopup(todoAuth,new GoogleAuthProvider());
    if(S.u?.uid!==trackerUid)return;
    const userRoot=doc(todoDb,'users',user.uid);
    const [config,tasks]=await Promise.all([
      getDoc(doc(userRoot,'meta','config')),getDocs(collection(userRoot,'tasks'))
    ]);
    if(S.u?.uid!==trackerUid)return;
    const sports=(config.data()?.domains||[]).filter(d=>d.name.trim().toLowerCase()==='sport');
    if(sports.length!==1)throw new Error('sport');
    const mapped=Object.fromEntries(todoNames.map(name=>{
      const matches=tasks.docs.filter(task=>{
        const t=task.data();
        return t.domainId===sports[0].id&&t.text.trim().toLowerCase()===name.toLowerCase()
          &&(t.repeat==='weekly'||(!t.repeat&&t.perWeek>0));
      });
      if(matches.length!==1)throw new Error('tasks');
      return [name,matches[0].id];
    }));
    const previous=todoState();
    saveTodoState(trackerUid,{uid:user.uid,mapped,pending:previous?.uid===user.uid?previous.pending:[]});
    todoMessage='To-do list connectée.';
  }catch(e){
    todoMessage=e.message==='sport'||e.message==='tasks'
      ?'Il faut une catégorie Sport avec les quatre tâches hebdomadaires Upper A, Upper B, Lower A et Lower B.'
      :'Connexion à la to-do list impossible. Vérifie le compte Google utilisé.';
  }finally{todoBusy=false;R();if(todoMessage==='To-do list connectée.')void syncTodo();}
}
async function checkTodoWorkout(root,mapped,workout){
  const week=todoWeek(workout.at);
  const state=doc(root,'workout_sync',`${week}-${workout.category}`);
  return runTransaction(todoDb,async tx=>{
    const snapshot=await tx.get(state);
    const seen=snapshot.data()?.workouts||[];
    if(seen.includes(workout.id))return 'Cette séance a déjà été traitée.';
    if(seen.length>=2)return 'Les deux séances de ce type ont déjà été traitées cette semaine.';
    const prefix=workout.category==='upper'?'Upper':'Lower';
    const task=doc(root,'tasks',mapped[`${prefix} ${seen.length?'B':'A'}`]);
    const target=(await tx.get(task)).data();
    if(!target||(target.repeat!=='weekly'&&(target.repeat||!(target.perWeek>0))))throw new Error('task');
    // Une séance en attente de la semaine passée ne doit pas modifier une case actuelle.
    const sameWeek=week===todoWeek(Date.now()),already=target.done&&target.doneAt>=week;
    if(sameWeek&&!already){
      const log=doc(collection(root,'logs'));
      tx.set(log,{domainId:target.domainId,note:target.text,taskId:task.id,ts:workout.at});
      tx.update(task,{done:true,doneAt:workout.at,logId:log.id});
    }
    tx.set(state,{workouts:[...seen,workout.id]});
    const name=`${prefix} ${seen.length?'B':'A'}`;
    return !sameWeek?'La séance appartient à une semaine passée.'
      :already?`${name} était déjà cochée.`:`${name} a été cochée dans la to-do list.`;
  });
}
async function syncTodo(){
  if(todoBusy||!S.u||!todoAuth.currentUser||!navigator.onLine)return;
  const trackerUid=S.u.uid,link=todoState();
  if(!link?.pending.length||link.uid!==todoAuth.currentUser.uid)return;
  todoBusy=true;
  try{
    const root=doc(todoDb,'users',link.uid);
    while(S.u?.uid===trackerUid&&todoAuth.currentUser?.uid===link.uid){
      const current=todoState();
      if(current?.uid!==link.uid||!current.pending.length)break;
      const workout=current.pending[0];
      todoMessage=await checkTodoWorkout(root,current.mapped,workout);
      if(S.u?.uid!==trackerUid)break;
      const latest=todoState();
      if(latest?.uid===link.uid)saveTodoState(trackerUid,{...latest,pending:latest.pending.filter(w=>w.id!==workout.id)});
    }
  }catch(e){
    todoMessage=e.code==='permission-denied'?'Synchronisation refusée par Firestore. Vérifie le compte Google utilisé.'
      :e.message==='task'?'Une tâche liée a été supprimée ou n’est plus hebdomadaire. Relie les tâches puis réessaie.'
      :'Synchronisation en attente. Vérifie ta connexion Internet puis réessaie.';
  }
  finally{todoBusy=false;if(S.cfg||S.summary&&!S.view&&S.tab==='train')R();}
}
function queueTodoWorkout(workout){
  const link=todoState();
  if(!workout?.made||!Object.keys(workout.done||{}).length){
    todoMessage='Aucun exercice enregistré dans cette séance.';
    return;
  }
  if(!link){
    todoMessage='La to-do list n’est pas liée sur cet appareil. Connecte-la pour reprendre la dernière séance.';
    return;
  }
  const id=workout.ref?.id||workout.workoutId;
  if(!id||!['upper','lower'].includes(workout.cat)||link.pending.some(w=>w.id===id))return;
  try{
    saveTodoState(S.u.uid,{...link,pending:[...link.pending,{id,category:workout.cat,at:Date.now()}]});
    void syncTodo();
  }catch{todoMessage='Impossible de conserver la séance à synchroniser sur cet appareil.';alert(todoMessage);}
}
async function recoverTodoWorkout(){
  const link=todoState();
  if(todoBusy||!S.u||!link||todoAuth.currentUser?.uid!==link.uid)return;
  const uid=S.u.uid;
  todoBusy=true;
  try{
    const week=todoWeek(Date.now());
    const snapshots=await getDocs(query(col('workouts'),where('date','>=',new Date(week).toISOString())));
    if(S.u?.uid!==uid||todoAuth.currentUser?.uid!==link.uid)return;
    const latest=snapshots.docs.filter(d=>{
      const row=d.data();
      return !row.imported&&['upper','lower'].includes(row.category);
    }).sort((a,b)=>b.data().date.localeCompare(a.data().date))[0];
    if(!latest){todoMessage='Aucune séance enregistrée cette semaine.';return;}
    const row=latest.data();
    const label=row.category==='upper'?'Upper':'Lower';
    const date=new Date(row.date).toLocaleString(LOC());
    if(!confirm(`Synchroniser la séance ${label} du ${date} ? Confirme seulement si tu as terminé cette séance.`))return;
    const current=todoState();
    if(current?.uid!==link.uid)return;
    if(!current.pending.some(w=>w.id===latest.id)){
      saveTodoState(uid,{...current,pending:[...current.pending,{id:latest.id,category:row.category,at:Date.parse(row.date)}]});
    }
    todoMessage='Séance mise en attente.';
  }catch{todoMessage='Impossible de récupérer la dernière séance.';}
  finally{todoBusy=false;if(S.cfg)R();void syncTodo();}
}
