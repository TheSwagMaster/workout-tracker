<style>
:root{--g:rgba(255,240,225,.06);--b:rgba(255,235,215,.14);--t:#f3ede6;--m:#a39a90}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--t);background:#131110;min-height:100vh;padding-top:env(safe-area-inset-top)}

main{max-width:640px;margin:auto;padding:16px 14px 120px}
.glass{background:var(--g);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--b);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,235,215,.2),0 10px 32px rgba(0,0,0,.3)}

.row{display:flex;gap:8px;align-items:center}
.s{color:var(--m);font-size:13px}

.set{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:8px;margin:6px 0;align-items:center}
.set.t{grid-template-columns:24px 1fr 44px}
.tm{font:600 44px ui-monospace,Menlo,monospace;text-align:center;margin:6px 0}
.item{padding:10px 0;border-top:1px solid rgba(255,255,255,.1)}

.drg{opacity:.35}.tgt{box-shadow:0 -2px 0 #e39a6e}

.menu button{display:block;width:100%;text-align:left;border:0;background:none}
.grp{border-top:1px solid rgba(255,255,255,.1);padding:8px 0}
.hd{color:var(--m);font-size:12px;margin-top:10px}
.big{font-size:18px;font-weight:600;padding:2px 0}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ch .tag{font-size:14px;padding:4px 10px}

<script type="module">

const cfg={apiKey:"AIzaSyA4rP3w3WcTYIDSfUw_py0Sa22EvDli2ao",authDomain:"personal-workout-tracker-ce007.firebaseapp.com",projectId:"personal-workout-tracker-ce007",storageBucket:"personal-workout-tracker-ce007.firebasestorage.app",messagingSenderId:"960475930805",appId:"1:960475930805:web:cde480d99a4b9dd6575efc"};
const app=initializeApp(cfg),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});

const PR=[
["September","npu,pu,dsp,owr,bc,te,plank,hlr","gs,ht,bss,rdl,cr,bic,sp"],
["October","chin,dpu,arn,bor,lat,ham,dead,rus","fsq,slht,wl,sldl,slcr,llr,dp"],
["October – New York","ir,fepu,pike,bpr,dia,bpc,dead,sts","bpsq,slhb,bss,bpsl,slcs,bic,sp"],
["November","wpu,spu,fp,owp,rf,oth,cc,rc,hol,hkr","gsp,htp,rl,rdlt,scr,cru,bd"]];
// date, category, "exercise:reps(or seconds):kg;..." , program index
const H=[
["2026-09-28","upper","npu:6,6,6:0;pu:15,15,15:0;dsp:8:20;owr:15:10;bc:11,8,7:8;te:15:2;plank:60:0;hlr:15:0",0],
["2026-09-29","lower","gs:30,30,30:16;ht:30,30,30:16;bss:10:10;rdl:20:10;cr:30,30,20:10;bic:20:0;sp:60:0",0],
["2026-10-15","upper","chin:6,3,3:0;dpu:15,15,7:0;arn:5,6,6:10;bor:15,15,15:10;lat:10,12,6:6;ham:20,20,15:6;dead:50:0;rus:50:6",1],
["2026-11-09","upper","wpu:6,4,2:0;spu:15,10,7:0;fp:25,18,15:20;owp:15,10,10:10;rf:8,7,6:6;oth:15,15,11:4;cc:15,10,8:8;rc:15,8,14:4;hol:60,10:0;hkr:15,15:0",3],
["2026-11-10","lower","gsp:30,30,30:16;htp:30,30,30:16;rl:30,30,30:10;rdlt:20,20,20:10",3]];

/* ---------- State ---------- */
let S={chat:[],aiUrl:'',ex:[],pr:[],act:null,tab:'train',op:{},edit:null,view:null,u:null,q:'',f:'all',sets:[],last:null,h:[]},W=null,T={acc:0,st:null};
const exOf=id=>S.ex.find(x=>x.id===id),prog=()=>S.pr.find(p=>p.id===S.act)||S.pr[0];
const el=()=>T.acc+(T.st?Date.now()-T.st:0),pause=()=>{if(T.st){T.acc+=Date.now()-T.st;T.st=null}};
const fm=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const fs=s=>s.s!=null?`${s.s} s`:`${s.r} × ${s.kg?s.kg+' kg':'BW'}`;
const fd=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

async function load(){
 const [a,b,c]=await Promise.all([getDocs(col('exercises')),getDocs(col('programs')),getDoc(doc(db,'user_settings','main'))]);
 S.ex=a.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>x.nameEn.localeCompare(y.nameEn));
 S.pr=b.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.order||0)-(x.order||0));
 S.act=c.exists()?c.data().activeProgramId:null;S.aiUrl=c.exists()?c.data().aiUrl||'':'';
}
async function logs(id){const r=await getDocs(query(col('exercise_logs'),where('exerciseId','==',id)));return r.docs.map(d=>d.data()).sort((x,y)=>y.date.localeCompare(x.date))}
async function seed(){
 const b=writeBatch(db),ids={},tt={};
 X.split('\n').forEach(l=>{const[k,en,fr,t,e]=l.split('|'),r=doc(col('exercises'));ids[k]=r.id;tt[k]=t=='t';b.set(r,{nameEn:en,nameFr:fr,type:t=='t'?'time':'reps',equipment:e=='1'})});
 const pr=PR.map(([n,u,l],i)=>{const r=doc(col('programs'));b.set(r,{name:n,order:i+1,upper:u.split(',').map(k=>ids[k]),lower:l.split(',').map(k=>ids[k])});return r.id});
 H.forEach(([d,c,s,p])=>{const w=doc(col('workouts')),dt=d+'T18:00:00';b.set(w,{date:dt,programId:pr[p],category:c,imported:true});
  s.split(';').forEach(x=>{const[k,v,kg]=x.split(':');b.set(doc(col('exercise_logs')),{exerciseId:ids[k],workoutId:w.id,date:dt,imported:true,duration:null,sets:v.split(',').map(n=>tt[k]?{s:+n}:{r:+n,kg:+kg})})})});
 b.set(doc(db,'user_settings','main'),{activeProgramId:pr[3]});
 await b.commit();await load();R();
}

/* ---------- Views ---------- */
const head=(t,back)=>`<div class="row" style="margin-bottom:14px">${back?'<button data-a="back">‹</button>':''}<h1 style="flex:1">${t}</h1>${back?'':'<button data-a="out" class="s">Sign out</button>'}</div>`;
const login=()=>`<main style="padding-top:18vh"><div class="glass card"><h1>Workout Tracker</h1><p class="s">Sign in to your account.</p><input id="em" type="email" placeholder="Email" autocomplete="username"><div style="height:8px"></div><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div style="height:12px"></div><button class="p" data-a="login" style="width:100%">Sign in</button><p class="s" id="er"></p></div></main>`;
const opts=()=>S.ex.map(e=>`<option value="${e.id}">${esc(e.nameEn)}</option>`).join('');
const gz=(P,c)=>{const n=P[c].length;return P[c+'G']||(c=='lower'&&n==7?[2,2,1,2]:Array.from({length:Math.ceil(n/2)},(_,i)=>i<Math.floor(n/2)?2:1))};
const groups=(P,c)=>{let i=0;return gz(P,c).map(k=>{const g=P[c].slice(i,i+k);i+=k;return g})};
function catCard(P,c){const G=groups(P,c),n=P[c].length,ed=S.edit==c,op=ed||S.op[c];let b=0;
 const hd=`<div class="row"><div data-a="tgo" data-c="${c}" style="flex:1;padding:4px 0"><h2>${c=='upper'?'Upper':'Lower'} body</h2><div class="s">${n} exercises · ${G.length} blocks ${op?'▴':'▾'}</div></div><button class="p" data-a="start" data-c="${c}">Start</button></div>`;
 if(!op)return `<div class="glass card" data-card="${c}">${hd}</div>`;
 const body=G.map((g,gi)=>{const o=b;b+=g.length;return `<div class="grp2" data-g="${gi}">${ed?`<span class="hdl" data-drag="${gi}" data-c="${c}">⠿</span>`:''}<div class="gx ${g.length>1?'ss':''}">${g.map((id,j)=>{const e=exOf(id);return `<div class="nm"><span>${e?esc(e.nameEn):'?'}</span>${ed?`<button class="ic" data-a="rm" data-c="${c}" data-i="${o+j}">✕</button>`:''}</div>`}).join('')}`+
  (ed?(g.length>1?`<button class="ghost" data-a="unl" data-c="${c}" data-g="${gi}">Unlink superset</button>`:G[gi+1]&&G[gi+1].length==1?`<button class="ghost" data-a="lnk" data-c="${c}" data-g="${gi}">Link with next ⛓</button>`:''):'')+`</div></div>`}).join('');
 const ft=ed?`<div class="row item"><select id="add-${c}"><option value="">Add an exercise…</option>${opts()}</select><button data-a="add" data-c="${c}">Add</button></div><button class="p" data-a="edt" data-c="${c}" style="width:100%">Done</button>`:`<div class="row" style="justify-content:flex-end"><button class="ghost" data-a="edt" data-c="${c}">Edit</button></div>`;
 return `<div class="glass card" data-card="${c}">${hd}<div style="height:6px"></div>${body}${ft}</div>`}
/* drag & drop des blocs */
let DR=null;const drClean=()=>{document.querySelectorAll('.drg,.tgt').forEach(x=>x.classList.remove('drg','tgt'));DR=null};
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag]');if(!h)return;e.preventDefault();DR={c:h.dataset.c,a:+h.dataset.drag,to:+h.dataset.drag};h.closest('.grp2').classList.add('drg');try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!DR)return;const t=document.elementsFromPoint(e.clientX,e.clientY).find(x=>x.classList&&x.classList.contains('grp2')&&x.closest('[data-card]')&&x.closest('[data-card]').dataset.card==DR.c);if(!t)return;document.querySelectorAll('.tgt').forEach(x=>x.classList.remove('tgt'));DR.to=+t.dataset.g;t.classList.add('tgt')});
const drEnd=()=>{if(!DR)return;const{c,a,to}=DR;drClean();if(a==to)return;const P=prog(),gs=groups(P,c),[m]=gs.splice(a,1);gs.splice(to,0,m);P[c]=gs.flat();P[c+'G']=gs.map(g=>g.length);saveP(P,c);R()};
document.addEventListener('pointerup',drEnd);document.addEventListener('pointercancel',drClean);
function train(){
 const P=prog();
 if(!P)return head('Training')+`<div class="glass card"><p>Your library is empty. Load your September–November programs and history to get started.</p><button class="p" data-a="seed">Load my data</button></div>`;
 return head('Training')+`<div class="row" style="margin-bottom:14px"><select id="ps">${S.pr.map(p=>`<option value="${p.id}" ${p.id===P.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><details class="mn"><summary>⋯</summary><div class="glass menu"><button data-a="newp">New program</button><button data-a="renp">Rename</button><button data-a="delp">Delete</button></div></details></div>`+catCard(P,'upper')+catCard(P,'lower');
}
const exList=()=>{const q=S.q.toLowerCase();const L=S.ex.filter(e=>(S.f=='all'||(S.f=='eq')==e.equipment)&&(e.nameEn+' '+e.nameFr).toLowerCase().includes(q));
 return L.map(e=>`<div class="glass card" data-a="hist" data-id="${e.id}" style="padding:12px 16px;margin-bottom:10px"><div class="row"><b style="flex:1">${esc(e.nameEn)}</b><span class="tag">${e.equipment?'With equipment':'No equipment'}</span></div><div class="s">${esc(e.nameFr)}${e.type=='time'?' · timed':''}</div></div>`).join('')||'<p class="s">No exercise found.</p>'};
const exTab=()=>head('Exercises')+`<input id="q" placeholder="Search in English or French" value="${esc(S.q)}" style="margin-bottom:10px"><div class="row" style="margin-bottom:12px">${[['all','All'],['eq','With equipment'],['no','No equipment']].map(([k,l])=>`<button data-a="flt" data-k="${k}" class="${S.f==k?'p':''}">${l}</button>`).join('')}</div>
<details class="glass card"><summary>New exercise</summary><div style="height:8px"></div><input id="n-en" placeholder="English name"><div style="height:8px"></div><input id="n-fr" placeholder="French name"><div style="height:8px"></div><select id="n-t"><option value="reps">Reps (weight optional)</option><option value="time">Time (seconds)</option></select><div style="height:8px"></div><select id="n-e"><option value="1">With equipment</option><option value="0">No equipment</option></select><div style="height:8px"></div><button class="p" data-a="newex">Add exercise</button></details><div id="list">${exList()}</div>`;
const soon=(t,p)=>head(t)+`<div class="glass card"><p>Coming in ${p}.</p></div>`;
async function loadSt(){try{const[a,b]=await Promise.all([getDocs(col('workouts')),getDocs(col('exercise_logs'))]);S.ws=a.docs.map(d=>d.data());S.lg=b.docs.map(d=>d.data());if(S.tab=='st'&&!S.view)R()}catch(e){alert('Could not load statistics: '+e.message)}}
const wk=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime()};
const chart=pts=>{if(pts.length<2)return '<div class="s">Log at least 2 sessions in this period to see a chart.</div>';const mx=Math.max(...pts),mn=Math.min(...pts),xy=pts.map((v,i)=>[12+i*276/(pts.length-1),60-(mx==mn?25:(v-mn)/(mx-mn)*45)]);return `<svg viewBox="0 0 300 70" style="width:100%"><polyline fill="none" stroke="#e39a6e" stroke-width="2" points="${xy.map(q=>q.join(',')).join(' ')}"/>${xy.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#e39a6e"/>`).join('')}</svg>`};
function stats(){
 if(!S.ws)return head('Statistics')+'<div class="glass card"><p class="s">Loading…</p></div>';
 const days=S.sp??30,now=Date.now(),cut=days?new Date(now-days*864e5).toISOString():'',inP=l=>l.date>=cut,ws=S.ws.filter(inP),lg=S.lg.filter(inP);
 const w0=wk(now),m0=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString();
 const nW=S.ws.filter(w=>wk(w.date)>=w0).length,nM=S.ws.filter(w=>w.date>=m0).length;
 const span=days||Math.max(7,Math.ceil((now-Math.min(now,...S.ws.map(w=>new Date(w.date).getTime())))/864e5)),avg=(ws.length/(span/7)).toFixed(1);
 const vol=Math.round(lg.reduce((a,l)=>a+l.sets.reduce((b,x)=>b+(x.kg>0?x.r*x.kg:0),0),0));
